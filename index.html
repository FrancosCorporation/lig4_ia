<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lig 4 com IA — FrancosCorporation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Lig 4 com IA</h1>
  <div id="barra">
    <label for="modo">Modo:</label>
    <select id="modo">
      <option value="pvp">Jogador × Jogador</option>
      <option value="facil">IA Fácil</option>
      <option value="medio" selected>IA Média</option>
      <option value="dificil">IA Difícil</option>
    </select>
    <button id="reiniciar" type="button">Reiniciar</button>
  </div>
  <div id="status">Vez das brancas</div>
  <div id="tabuleiro" aria-label="Tabuleiro de Lig 4"></div>
  <div id="placar">Brancas 0 × 0 Pretas</div>
  <div id="rodape">Minimax com poda + avaliação por janelas de 4 rodando no browser · FrancosCorporation</div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
